#
# Biomass availability sensitivity campaign, restricted to Austria.
#
# Each scenario scales the biomass potential columns of
# resources/{prefix}/{scenario}/biomass_potentials_s_{clusters}_{planning_horizons}.csv
# for Austrian regions only (factors.AT); every other modelled country keeps its
# unscaled potential (factors.default: 1.0). Factors run from 0.5 to 4.0 in steps
# of 0.25; BIO_AT_100 is the unscaled reference run. Mirrors
# scenarios.biomass-sensitivities.yaml, which scales all modelled countries
# instead of Austria alone.
#
# Run with:
#   pixi run snakemake --configfile config/config.sensitivities-biomass-at.yaml -call
#
# The carrier list and `enable` flag are inherited from config/config.at.yaml.

BIO_AT_050:
  description: Austrian biomass availability at 50% of the reference (factor 0.5); all other countries unscaled
  mods:
    biomass_potential_scaling:
      factors:
        default: 1.0
        AT: 0.5

