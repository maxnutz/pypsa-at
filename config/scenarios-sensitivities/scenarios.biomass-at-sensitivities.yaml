#
# Biomass availability sensitivity campaign, restricted to Austria.
#
# Each scenario scales the biomass potential columns of
# resources/{prefix}/{scenario}/biomass_potentials_s_{clusters}_{planning_horizons}.csv
# for Austrian regions only (factors.AT); every other modelled country keeps its
# unscaled potential (factors.default: 1.0). Factors are 0.6, 0.7, 0.8 and 0.9 below the reference and 1.25 to 3.0 in
# steps of 0.25 above it (13 runs);
# BIO_AT_100 is the unscaled reference run. Mirrors
# scenarios.biomass-sensitivities.yaml, which scales all modelled countries
# instead of Austria alone.
#
# Run with:
#   pixi run snakemake --configfile config/config.sensitivities-biomass-at.yaml -call
#
# The carrier list and `enable` flag are inherited from config/config.at.yaml.
#
# The campaign config also overrides `biomass.share_unsustainable_use_retained`
# (0 in every year) and `biomass.share_sustainable_potential_available` (1 in
# every year), so no biomass generator is must-run and the factor below scales a
# genuine availability ceiling in all four horizons. See the comment above the
# `biomass:` block in the campaign config.
#
# Austria is not part of one of the closed biomass-transport islands that limit
# the all-country campaign (see scenarios.biomass-sensitivities.yaml), so the
# factors here are unconstrained from below by that mechanism.

BIO_AT_060:
  description: Austrian biomass availability at 60% of the reference (factor 0.6); all other countries unscaled
  mods:
    biomass_potential_scaling:
      factors:
        default: 1.0
        AT: 0.6

