#
# Biomass availability sensitivity campaign.
#
# Each scenario scales every biomass potential column of
# resources/{prefix}/{scenario}/biomass_potentials_s_{clusters}_{planning_horizons}.csv
# by one factor, applied to all modelled countries via `factors.default`.
# Factors run from 0.5 to 4.0 in steps of 0.25; BIO_100 is the unscaled reference run.
#
# Run with:
#   pixi run snakemake --configfile config/config.sensitivities-biomass.yaml -call
#
# The carrier list and `enable` flag are inherited from config/config.at.yaml.
# To restrict the scaling to Austria, give a country entry alongside the default:
#
#   mods:
#     biomass_potential_scaling:
#       factors:
#         default: 1.0
#         AT: 0.5

BIO_050:
  description: Biomass availability at 50% of the reference (factor 0.5)
  mods:
    biomass_potential_scaling:
      factors:
        default: 0.5

BIO_075:
  description: Biomass availability at 75% of the reference (factor 0.75)
  mods:
    biomass_potential_scaling:
      factors:
        default: 0.75

